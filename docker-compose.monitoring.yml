# Monitoring: Prometheus collects the manager's metrics, Grafana shows the dashboards.
# Enable in .env (combine with an audio overlay if used):
#   COMPOSE_FILE=docker-compose.yml:docker-compose.monitoring.yml
#   GRAFANA_ADMIN_PASSWORD=<password>
# Grafana: http://<host>:${GRAFANA_PORT:-3001}  (user "admin")
services:
  manager:
    environment:
      METRICS_PORT: "9464"
      # Link "Monitoring" in the web interface
      GRAFANA_PORT: ${GRAFANA_PORT:-3001}
    # Reachable for Prometheus inside the compose network only, not on the host.
    expose:
      - "9464"

  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: modellbahn-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-90d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-2GB}
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    # Web UI only on this machine (for debugging queries); Grafana talks to it internally.
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.4
    container_name: modellbahn-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD in .env setzen}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/modellbahn.json
      GF_DEFAULT_LOCALE: de-DE
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
